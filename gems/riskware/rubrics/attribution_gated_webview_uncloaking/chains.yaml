rubric_id: attribution_gated_webview_uncloaking
chains_version: 0.2.0
# The five "MMP cloaking" signals from the private source-of-truth spreadsheet.
# Strength→points: strong=8 · medium=4 · weak=2 · non_signal=0 (binary per chain).
# chains[0] is the fully-TRACED strong chain (graph in graph.yaml); goldenMission
# compiles the live mission from it, so it MUST stay first and keep its legacy id.
chains:
  - chain_id: attribution_gated_webview_uncloaking_strong_8
    name: App loads affiliate link into a Webview w/ conversion data
    strength: strong
    points: 8
    score_mode: all_or_nothing
    required_boundaries: [acquisition_signal, cloaking_gate, destination_resolution, render]
    required_nodes: [n4_callback, n6_gate, n8_resolve, n10_load]
  - chain_id: attribution_gated_webview_uncloaking__app_changes_its_behavior_based_on_co
    name: App changes its behavior based on conversion data (e.g. Organic/NonOrganic)
    strength: strong
    points: 8
    score_mode: all_or_nothing
  - chain_id: attribution_gated_webview_uncloaking__app_stores_conversion_data
    name: App stores conversion data
    strength: medium
    points: 4
    score_mode: all_or_nothing
  - chain_id: attribution_gated_webview_uncloaking__app_sends_conversion_data_to_a_remote
    name: App sends conversion data to a remote endpoint (not to Ads provider)
    strength: weak
    points: 2
    score_mode: all_or_nothing
  - chain_id: attribution_gated_webview_uncloaking__conversion_flow_is_empty
    name: Conversion flow is empty
    strength: non_signal
    points: 0
    score_mode: all_or_nothing
